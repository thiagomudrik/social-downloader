plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.socialdownloader.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.socialdownloader.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

chaquopy {
    defaultConfig {
        version "3.8"
        pip {
            install "yt-dlp"
            install "requests"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
